name: Resolve Host API OpenTelemetry Go modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false
      - name: Generate and validate the vendored dependency patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          go get go.opentelemetry.io/otel@v1.47.0 \
            go.opentelemetry.io/otel/metric@v1.47.0 \
            go.opentelemetry.io/otel/trace@v1.47.0 \
            go.opentelemetry.io/otel/sdk@v1.47.0 \
            go.opentelemetry.io/otel/sdk/metric@v1.47.0
          go mod tidy
          go mod vendor
          go list -mod=vendor -deps -f '{{with .Module}}{{.Path}} {{.Version}}{{end}}' . |
            sort -u | grep '^go.opentelemetry.io/' | tee evidence/active-otel.txt
          grep -Fx 'go.opentelemetry.io/otel/trace v1.47.0' evidence/active-otel.txt
          git add -- go.mod go.sum vendor
          git diff --cached --check
          git diff --cached --binary --full-index -- go.mod go.sum vendor > evidence/otel147.patch
          git diff --cached --stat -- go.mod go.sum vendor > evidence/otel147.stat
          test -s evidence/otel147.patch
      - name: Retain generated patch and selected modules
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-api-otel147-vendor-patch
          path: evidence/
          if-no-files-found: error
          retention-days: 7
